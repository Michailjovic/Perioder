# Perioder v0.9.30 - JEDEN VIEW (single VIEW, not a whole-dashboard file).
# Denní věci pro cyklus-ownera. Admin/diagnostika je v samostatném souboru
# dashboard_test_admin.yaml jako DRUHÝ, samostatný dashboard.
#
# Design v0.9.14/15 - co se změnilo oproti v0.9.13:
#   1. Celý obsah je teď v JEDNOM `vertical-stack`u. Bez toho si Lovelace
#      masonry view karty samo přerovnává do víc sloupců podle šířky
#      obrazovky (na širokém displeji to vypadalo "rozsypaně" - symptomy a
#      kalendář skákaly do jiného sloupce než zbytek). Vertical-stack se
#      počítá jako JEDNA karta, takže se pořadí shora dolů už nemění.
#   2. Kalendář dole už neukazuje PMS (to je jen pro admina, viz
#      dashboard_test_admin.yaml).
#
# v0.9.30: kalendář dole je teď vlastní karta `custom:perioder-calendar-card`
# (viz CALENDAR-CARD-ADR.md) místo vestavěné HA kalendářové karty - žádný
# card-mod trik na výšku, žádné "barvy jsou jen nějak odlišené". Barvy jsou
# pevné a admin je může upravit přes editor karty (tužka > upravit v GUI,
# ne jen YAML). Tabletková ikonka je vidět i v den, kdy zrovna běží
# perioda/plodné okno - dřív mizela za "+n more".
#
# Setup:
#   1. Integrace musí být pojmenovaná přesně "Test".
#   2. Po instalaci/aktualizaci na v0.9.30 restartuj HA nebo znovu načti
#      integraci (Nastavení > Zařízení a služby > Perioder > tři tečky >
#      Znovu načíst) - jen tak se zaregistruje nová Lovelace resource s
#      kartou.
#   3. Nastavení > Ovládací panely > "Přidat ovládací panel" > "Nový panel
#      od začátku" > otevřít > tužka (edit mode) > tři tečky > "Upravit v
#      YAML" (edituje jen tenhle jeden view).
#   4. Smaž, co tam je, vlož celý tenhle soubor. Ulož.
#
# Pokud používáš jiný název integrace než "Test", nahraď "test" ve všech
# entity_id níže svým vlastním slugem (zkontroluj Developer Tools > States).

title: Cyklus
path: perioder-test
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        content: >-
          🌷 Tlačítka níž **podrž** prstem (nestačí jen ťuknout) - ať se nic
          nezapíše omylem, když jen scrolluješ. Periodu zapiš, jakmile
          začne/skončí, klidně i zpětně, pokud to zapomeneš hned ten den.

      - type: markdown
        content: >-
          {% set s = states('sensor.test_contraception_status') %}
          {% set map = {
            'pending': '⏳ Čeká se, až si dnes vezmeš tabletu',
            'taken': '✅ Dnešní tableta potvrzená',
            'missed': '💭 Dnešní tableta zatím nepotvrzená',
            'paused': '🌙 Dnes je pauza, tablety netřeba',
            'inactive': '💤 Sledování antikoncepce je vypnuté'
          } %}
          ### {{ map.get(s, s) }}

      - type: tile
        entity: button.test_confirm_pill_taken
        name: Podrž pro potvrzení prášku
        icon: mdi:pill
        color: pink
        tap_action:
          action: none
        hold_action:
          action: perform-action
          perform_action: button.press
          target:
            entity_id: button.test_confirm_pill_taken

      - type: horizontal-stack
        cards:
          - type: tile
            entity: date.test_last_period_start
            name: Perioda začala
            icon: mdi:water-outline
            color: red
          - type: tile
            entity: date.test_last_period_end
            name: Perioda skončila
            icon: mdi:water-off-outline
            color: red

      - type: horizontal-stack
        cards:
          - type: tile
            entity: sensor.test_cycle_day
            name: Den cyklu
            icon: mdi:moon-waning-crescent
            color: purple
          - type: tile
            entity: sensor.test_next_period
            name: Za kolik dní perioda
            icon: mdi:calendar-heart
            color: purple

      - type: horizontal-stack
        cards:
          - type: tile
            entity: number.test_pills_in_stock
            name: Zásoba prášků doma
            icon: mdi:pill-multiple
            color: amber
          - type: tile
            entity: time.test_reminder_time
            name: Kdy chci připomenout
            icon: mdi:alarm
            color: amber

      - type: tile
        entity: select.test_notification_intensity
        name: Jak moc naléhavě upozornit
        icon: mdi:volume-vibrate
        color: amber

      - type: markdown
        content: "### 💜 Jak se dnes cítíš? (podrž pro zapsání)"

      - type: horizontal-stack
        cards:
          - type: tile
            entity: button.test_log_symptom_cramps
            name: Křeče
            icon: mdi:lightning-bolt-outline
            color: purple
            tap_action:
              action: none
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.test_log_symptom_cramps
          - type: tile
            entity: button.test_log_symptom_headache
            name: Bolest hlavy
            icon: mdi:head-alert-outline
            color: purple
            tap_action:
              action: none
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.test_log_symptom_headache

      - type: horizontal-stack
        cards:
          - type: tile
            entity: button.test_log_symptom_low_energy
            name: Nízká energie
            icon: mdi:battery-low
            color: purple
            tap_action:
              action: none
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.test_log_symptom_low_energy
          - type: tile
            entity: button.test_log_symptom_mood_change
            name: Změna nálady
            icon: mdi:emoticon-outline
            color: purple
            tap_action:
              action: none
            hold_action:
              action: perform-action
              perform_action: button.press
              target:
                entity_id: button.test_log_symptom_mood_change

      - type: markdown
        content: >-
          {% set sym = states('sensor.test_last_symptom') %}
          {% set map = {
            'cramps': 'křeče', 'headache': 'bolest hlavy',
            'low_energy': 'nízká energie', 'mood_change': 'změna nálady'
          } %}
          {% if sym not in ['unknown', 'unavailable', ''] %}
          Naposledy zapsáno: **{{ map.get(sym, sym) }}**
          {% endif %}

      - type: custom:perioder-calendar-card
        title: Kalendář cyklu
        entities:
          - entity: calendar.test_period_calendar
            color: "#E24B4A"
            icon: mdi:water
          - entity: calendar.test_fertile_calendar
            color: "#378ADD"
            icon: mdi:flower
          - entity: calendar.test_pause_calendar
            color: "#7F77DD"
            icon: mdi:moon-waning-crescent
        pill_entity: calendar.test_pill_calendar
