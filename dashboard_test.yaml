# Perioder v0.1.0 - test dashboard
#
# Setup:
#   1. Integration must be named exactly "Test" during setup (Settings >
#      Devices & Services > Add Integration > Perioder) - every entity ID
#      below depends on that.
#   2. Settings > Dashboards > Add Dashboard > "New dashboard from scratch"
#      > open it > pencil icon (Edit Dashboard) > three-dot menu >
#      "Edit in YAML" > paste this whole file > Save.
#
# That's it - no helpers, no scripts. "Zapsat začátek periody" below is a
# native date entity from the integration itself: click it, pick a date
# (today, or an earlier one if you're only entering it the next day), done.
# Same for the PMS dropdown - pick a value, it applies immediately.
#
# If you used a different integration name than "Test", replace "test" in
# every entity_id below with your own slug (check Developer Tools > States).

title: Perioder (test)
views:
  - title: Cyklus
    path: perioder-test
    cards:
      - type: markdown
        content: >-
          **Perioder v0.1.0 - test dashboard.** Klikni na "Zapsat začátek
          periody" a vyber datum - i zpětně, pokud se to dozvíš až druhý
          den. "PMS přebití" testuje PMS okno bez čekání na skutečné datum.

      - type: glance
        title: Stav cyklu
        entities:
          - entity: sensor.test_cycle_day
            name: Den cyklu
          - entity: sensor.test_phase
            name: Fáze
          - entity: sensor.test_fertility
            name: Plodnost
          - entity: sensor.test_next_period
            name: Další perioda (dny)

      - type: gauge
        entity: sensor.test_cycle_day
        name: Den cyklu
        min: 1
        max: 40
        needle: true

      - type: entities
        title: Ostatní senzory
        entities:
          - entity: binary_sensor.test_period_active
            name: Perioda probíhá
          - entity: binary_sensor.test_pms_active
            name: "PMS okno (admin/testing pohled)"
            secondary_info: last-changed

      - type: entities
        title: Ovládání
        entities:
          - entity: date.test_last_period_start
            name: Zapsat začátek periody
          - entity: select.test_pms_override
            name: PMS přebití
