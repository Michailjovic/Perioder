# Perioder v0.9.3 - test dashboard (single VIEW, not a whole-dashboard file)
#
# Setup:
#   1. Integration must be named exactly "Test" during setup.
#   2. The two calendar cards need the "Atomic Calendar Revive" custom card
#      (HACS > Frontend > search "Atomic Calendar Revive" > Install > reload
#      the browser, Ctrl+Shift+R). This is the ONE piece of this dashboard
#      that isn't a plain native HA card - the built-in calendar card has no
#      way to fix its month-grid row height when a multi-day event's label
#      gets clipped, see the comment above the calendar cards below.
#   3. Settings > Dashboards > Add Dashboard > "New dashboard from scratch"
#      (any title) > open it > pencil icon (top right) to enter edit mode
#      > three-dot menu > "Edit in YAML".
#   4. That editor is for the CURRENT VIEW only - it starts with something
#      like `title: Home` / `cards: []`. Delete all of it and paste this
#      whole file in its place (do NOT wrap it in an extra `views:` key -
#      that caused the blank-page issue). Save.
#
# Even simpler alternative to all of the above: skip this file entirely and
# use Settings > Devices & Services > Perioder > "test" > "Add to dashboard"
# (visible at the bottom of the device's Sensors card) - it builds an
# entities card from every entity on the device automatically, no YAML.
# This file just gives you nicer cards (glance, gauge) on top of that.
#
# If you used a different integration name than "Test", replace "test" in
# every entity_id below with your own slug (check Developer Tools > States).

title: Cyklus
path: perioder-test
cards:
  - type: markdown
    content: >-
      **Perioder v0.9.3 - test dashboard.** Klikni na "Zapsat začátek
      periody" a vyber datum - i zpětně, pokud se to dozvíš až druhý den.
      "PMS přebití" testuje PMS okno bez čekání na skutečné datum. Antikoncepci
      nejdřív jednou nastartuj přes `perioder.start_new_pack` (Developer
      Tools > Actions), pak už jen mačkej "Potvrdit prášek". Kalendář "Kalendář
      cyklu" ukazuje predikce period/plodných dní/pauz balení a zpětně i to,
      kdy byl prášek skutečně potvrzený (a o kolik pozdě); "Sdílený kalendář"
      ukazuje jen generické "Citlivé období" bloky bez detailu (výchozí
      nastavení: jen perioda). Denní připomínka a eskalace fungují jen pokud
      máš v Configure vyplněné "Your own notify device" - kontrola běží
      každých 15 minut, ne přesně na čas. Ta samá připomínka/eskalace má teď i
      dvě tlačítka přímo v push notifikaci - "Vzal(a) jsem" a "Odložit" -
      vyžaduje aktuální Home Assistant Companion app, projeví se jen na
      telefonu, ne tady na dashboardu.

  - type: glance
    title: Stav cyklu
    entities:
      - entity: sensor.test_cycle_day
        name: Den cyklu
      - entity: sensor.test_phase
        name: Fáze
      - entity: sensor.test_fertility
        name: Plodnost
      - entity: sensor.test_next_period
        name: Další perioda (dny)

  - type: gauge
    entity: sensor.test_cycle_day
    name: Den cyklu
    min: 1
    max: 40
    needle: true

  - type: entities
    title: Ostatní senzory
    entities:
      - entity: binary_sensor.test_period_active
        name: Perioda probíhá
      - entity: binary_sensor.test_pms_active
        name: "PMS okno (admin/testing pohled)"
        secondary_info: last-changed

  - type: entities
    title: Antikoncepce
    entities:
      - entity: sensor.test_contraception_status
        name: Stav dnes
      - entity: sensor.test_pack_days_remaining
        name: Zbývá dní v balení
      - entity: binary_sensor.test_contraception_active
        name: Sledování aktivní
      - entity: number.test_pills_in_stock
        name: Zásoba prášků doma

  - type: entities
    title: Ovládání
    entities:
      - entity: date.test_last_period_start
        name: Zapsat začátek periody
      - entity: date.test_last_period_end
        name: Zapsat konec periody
      - entity: select.test_pms_override
        name: PMS přebití
      - entity: button.test_confirm_pill_taken
        name: Potvrdit prášek
      - entity: switch.test_pause_notifications
        name: Pozastavit notifikace

  - type: entities
    title: Symptomy
    entities:
      - entity: sensor.test_last_symptom
        name: Poslední symptom
        secondary_info: last-changed
      - entity: button.test_log_symptom_cramps
        name: "Zapsat: křeče"
      - entity: button.test_log_symptom_headache
        name: "Zapsat: bolest hlavy"
      - entity: button.test_log_symptom_low_energy
        name: "Zapsat: nízká energie"
      - entity: button.test_log_symptom_mood_change
        name: "Zapsat: změna nálady"

  - type: markdown
    title: Podporovatelé
    content: >-
      {% set s = state_attr('sensor.test_supporters', 'supporters') or [] %}
      {% if s | length == 0 %}
      Zatím žádní podporovatelé - přidej je v Nastavení > Zařízení a služby >
      Perioder > Konfigurovat.
      {% else %}
      {% for supporter in s %}
      - **{{ supporter.device_id }}** ({{ supporter.detail_level }}): {{ supporter.categories }}
      {% endfor %}
      {% endif %}

  # Vestavěná HA kalendářová karta (type: calendar) nemá žádnou YAML/card-mod
  # cestu, jak spolehlivě zvětšit výšku řádků měsíční mřížky - card-mod na
  # ni vyzkoušený nepomohl (nahlášeno živě 2026-07-29). Použit "Atomic
  # Calendar Revive" (HACS > Frontend > vyhledej "Atomic Calendar Revive" >
  # Install > reload prohlížeče, Ctrl+Shift+R). Bere libovolnou
  # calendar.* entitu stejně jako vestavěná karta (entities: [{entity: ...}]),
  # jen navíc má `cardHeight` - žádný CSS hack. NEOVĚŘENO živě.
  - type: custom:atomic-calendar-revive
    name: Kalendář cyklu (detailní)
    entities:
      - entity: calendar.test_cycle_calendar
    defaultMode: Calendar
    enableModeChange: false
    showMultiDay: true
    firstDayOfWeek: 1
    cardHeight: "700px"

  - type: custom:atomic-calendar-revive
    name: Sdílený kalendář (bez detailu)
    entities:
      - entity: calendar.test_shared_calendar
    defaultMode: Calendar
    enableModeChange: false
    showMultiDay: true
    firstDayOfWeek: 1
    cardHeight: "500px"
