# Perioder v0.1.0 - test dashboard
#
# How to install:
#   1. When you set up the Perioder integration (Settings > Devices &
#      Services > Add Integration > Perioder), type exactly "Test" as the
#      name. That makes every entity ID below match without any editing.
#   2. Settings > Dashboards > Add Dashboard > "New dashboard from scratch",
#      give it any title, create it.
#   3. Open it > pencil icon (Edit Dashboard) > three-dot menu > "Edit in
#      YAML" > delete everything there > paste this whole file > Save.
#   4. Call perioder.log_period_start once (Developer Tools > Actions) so
#      the cards below stop showing "unknown".
#
# If you used a different name than "Test", replace "test" in every
# entity_id below with your own slug (check Developer Tools > States).

title: Perioder (test)
views:
  - title: Cyklus
    path: perioder-test
    cards:
      - type: markdown
        content: >-
          **Perioder v0.1.0 - test dashboard.** Log the first data point via
          Developer Tools > Actions > `perioder.log_period_start` (pick the
          cycle owner from the dropdown, optionally backdate). Try
          `perioder.set_pms_override` the same way to force the PMS card on
          or off without waiting for the real date.

      - type: glance
        title: Stav cyklu
        entities:
          - entity: sensor.test_cycle_day
            name: Den cyklu
          - entity: sensor.test_phase
            name: Fáze
          - entity: sensor.test_fertility
            name: Plodnost
          - entity: sensor.test_next_period
            name: Další perioda (dny)

      - type: gauge
        entity: sensor.test_cycle_day
        name: Den cyklu
        min: 1
        max: 40
        needle: true

      - type: entities
        title: Ostatní senzory
        entities:
          - entity: binary_sensor.test_period_active
            name: Perioda probíhá
          - entity: binary_sensor.test_pms_active
            name: "PMS okno (admin/testing pohled)"
            secondary_info: last-changed
