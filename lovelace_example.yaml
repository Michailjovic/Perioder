# A single card you can paste into an EXISTING dashboard's YAML (as one
# item in a "cards:" list) if you don't want a whole separate test
# dashboard - for that, see dashboard_test.yaml instead.
#
# Entity IDs assume you named the cycle owner "Test" during setup; adjust
# the "test" slug below if you used a different name (check Developer
# Tools > States).
#
# binary_sensor.<name>_pms_active is included here only because this card
# is for the admin/testing view. The design intent (see
# ANALYZA-A-ROADMAP.md, section 2.2/2.9) is that PMS is supporter-facing
# only and would normally be left off the cycle owner's own dashboard.

type: entities
title: Perioder (test)
entities:
  - entity: sensor.test_cycle_day
    name: Cycle day
  - entity: sensor.test_phase
    name: Phase
  - entity: sensor.test_fertility
    name: Fertility
  - entity: sensor.test_next_period
    name: Next period (days)
  - entity: binary_sensor.test_period_active
    name: Period active
  - entity: binary_sensor.test_pms_active
    name: "PMS window (admin/testing view only)"
