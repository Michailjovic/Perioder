log_period_start:
  name: Log period start
  description: >-
    Mark the start of a period for one cycle owner. Defaults to today if
    date is omitted - accepts a past date for backdating ("she told me it
    started yesterday").
  fields:
    config_entry_id:
      name: Cycle owner
      description: Which Perioder cycle owner this applies to.
      required: true
      selector:
        config_entry:
          integration: perioder
    date:
      name: Date
      description: Optional backdated start date.
      example: "2026-07-22"
      selector:
        date:

set_pms_override:
  name: Set PMS window override
  description: >-
    Manually force the PMS window on or off for the current cycle, or clear
    the override to go back to the automatic window. Also handy for testing
    the PMS-facing dashboard/notifications without waiting for the real date.
  fields:
    config_entry_id:
      name: Cycle owner
      description: Which Perioder cycle owner this applies to.
      required: true
      selector:
        config_entry:
          integration: perioder
    value:
      name: Value
      description: "auto = automatic window, active = force on, inactive = force off."
      required: true
      example: "auto"
      selector:
        select:
          options:
            - label: Automatic
              value: "auto"
            - label: Force active
              value: "active"
            - label: Force inactive
              value: "inactive"

log_pill_taken:
  name: Log pill taken
  description: >-
    Confirm today's contraception dose as taken for one cycle owner. Defaults
    to today if date is omitted - accepts a past date for backdating. The
    "Confirm pill taken" button entity calls this for today only; use this
    service for backdating or automations/voice/NFC.
  fields:
    config_entry_id:
      name: Cycle owner
      description: Which Perioder cycle owner this applies to.
      required: true
      selector:
        config_entry:
          integration: perioder
    date:
      name: Date
      description: Optional backdated date.
      example: "2026-07-28"
      selector:
        date:

start_new_pack:
  name: Start new contraception pack
  description: >-
    Start a new pack for one cycle owner, resetting the pack-day count.
    Defaults to today if date is omitted - accepts a past date for
    backdating. Also turns contraception tracking on.
  fields:
    config_entry_id:
      name: Cycle owner
      description: Which Perioder cycle owner this applies to.
      required: true
      selector:
        config_entry:
          integration: perioder
    date:
      name: Pack start date
      description: Optional backdated pack start date.
      example: "2026-07-01"
      selector:
        date:

set_contraception_active:
  name: Set contraception tracking active
  description: >-
    Turn contraception tracking on or off for one cycle owner without
    losing the pill log history - use this when starting or pausing
    contraception use entirely, not for a single missed/paused day.
  fields:
    config_entry_id:
      name: Cycle owner
      description: Which Perioder cycle owner this applies to.
      required: true
      selector:
        config_entry:
          integration: perioder
    active:
      name: Active
      description: true = tracking on, false = tracking off.
      required: true
      example: true
      selector:
        boolean:

update_settings:
  name: Update settings
  description: >-
    Update one or more settings for a cycle owner outside of Options Flow -
    handy for automations/voice/NFC. Only the fields you provide are
    changed; everything else keeps its current value. Same effect as
    "Edit settings" in Settings > Devices & Services > Perioder > Configure.
  fields:
    config_entry_id:
      name: Cycle owner
      description: Which Perioder cycle owner this applies to.
      required: true
      selector:
        config_entry:
          integration: perioder
    cycle_length:
      name: Cycle length
      description: In days. Must stay longer than period duration.
      example: 28
      selector:
        number:
          min: 15
          max: 60
          unit_of_measurement: d
    period_duration:
      name: Period duration
      description: In days. Must stay shorter than cycle length.
      example: 5
      selector:
        number:
          min: 1
          max: 14
          unit_of_measurement: d
    goal:
      name: Goal
      selector:
        select:
          options:
            - label: Just tracking
              value: "track"
            - label: Avoiding pregnancy
              value: "avoid"
            - label: Planning pregnancy
              value: "plan"
    pms_window_days:
      name: PMS window
      description: Days before the predicted period.
      example: 4
      selector:
        number:
          min: 0
          max: 10
          unit_of_measurement: d
    regimen_type:
      name: Contraception regimen
      selector:
        select:
          options:
            - label: 21 active days + 7 pause days
              value: "21_7"
            - label: 24 active days + 4 pause days
              value: "24_4"
            - label: Continuous (no pause)
              value: "continuous"
            - label: Custom
              value: "custom"
    pack_size:
      name: Pack size
      description: In days. Only used for the "custom" regimen.
      example: 21
      selector:
        number:
          min: 1
          max: 90
          unit_of_measurement: d
    pause_days:
      name: Pause days
      description: Only used for the "custom" regimen.
      example: 7
      selector:
        number:
          min: 0
          max: 30
          unit_of_measurement: d
    reminder_time:
      name: Daily contraception reminder time
      selector:
        time:
