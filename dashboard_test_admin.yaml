# Perioder v0.9.30 - JEDEN VIEW, SAMOSTATNÝ druhý dashboard (ne záložka) -
# admin/diagnostika: PMS okno, podporovatelé, korekce dat, testovací
# notifikace, pauza notifikací, kalendáře. Denní věci pro cyklus-ownera
# jsou v dashboard_test.yaml.
#
# v0.9.30: přehledový kalendář (perioda/plodné dny/PMS/pauza/tabletka) je
# teď vlastní karta `custom:perioder-calendar-card` (viz
# CALENDAR-CARD-ADR.md) místo vestavěné HA kalendářové karty - pevné,
# admin-volitelné barvy per kategorie a tabletková ikonka, co nikdy
# nezmizí za "+n more". Vyžaduje restart/reload integrace po update na
# v0.9.30, ať se zaregistruje nová Lovelace resource. Detailní kalendář
# (vč. potvrzení prášků) a sdílený kalendář zůstávají na vestavěné kartě -
# jsou to jednotlivé entity, nemají barevný konflikt mezi kategoriemi,
# který nová karta řeší.
#
# Setup: stejný postup jako u dashboard_test.yaml - založ DRUHÝ, nový
# dashboard od začátku, "Upravit v YAML" (jeden view), vlož celý tenhle
# soubor.
#
# Pokud používáš jiný název integrace než "Test", nahraď "test" ve všech
# entity_id níže svým vlastním slugem (zkontroluj Developer Tools > States).

title: Admin
path: perioder-test-admin
cards:
  - type: vertical-stack
    cards:
      - type: markdown
        content: >-
          **Perioder v0.9.30.** Tenhle dashboard je pro admina, ne pro
          cyklus-ownera - proto tu je PMS okno, podporovatelé, testovací
          notifikace a korekce dat, co se v běžném dni neřeší. "Datum začátku
          balení" slouží jen na výslovné nastavení/opravu (stejně jako "Zapsat
          začátek periody") - nastaví se jednou a dny/pauzy/připomínky se pak
          počítají samy dokola, nemusí se nastavovat znovu každý cyklus.
          "Testovací notifikace" pošle push okamžitě, bez ohledu na čas
          připomínky - dobré na ověření, že `owner_notify_device` a Companion
          app fungují. Přehledový kalendář dole má vlastní barvy per kategorii
          (uprav přes tužku/editor karty) a tabletkovou ikonku, co je vidět i
          v den, kdy běží perioda/plodnost. "Kalendář cyklu (detailní)" navíc
          zpětně ukazuje, kdy byl prášek skutečně potvrzený (a o kolik pozdě);
          "Sdílený kalendář" ukazuje jen generické "Citlivé období" bloky bez
          detailu podle zaškrtnutých kategorií v Configure.

      - type: glance
        title: Stav cyklu
        entities:
          - entity: sensor.test_cycle_day
            name: Den cyklu
          - entity: sensor.test_phase
            name: Fáze
          - entity: sensor.test_fertility
            name: Plodnost
          - entity: sensor.test_next_period
            name: Další perioda (dny)

      - type: gauge
        entity: sensor.test_cycle_day
        name: Den cyklu
        min: 1
        max: 40
        needle: true

      - type: entities
        title: Ostatní senzory
        entities:
          - entity: binary_sensor.test_period_active
            name: Perioda probíhá
          - entity: binary_sensor.test_pms_active
            name: "PMS okno (admin pohled - nezobrazuje se cyklus-ownerovi)"
            secondary_info: last-changed

      - type: entities
        title: Antikoncepce
        entities:
          - entity: sensor.test_contraception_status
            name: Stav dnes
          - entity: sensor.test_pack_days_remaining
            name: Zbývá dní v balení
          - entity: binary_sensor.test_contraception_active
            name: Sledování aktivní
          - entity: number.test_pills_in_stock
            name: Zásoba prášků doma

      - type: entities
        title: Ovládání
        entities:
          - entity: date.test_last_period_start
            name: Zapsat začátek periody
          - entity: date.test_last_period_end
            name: Zapsat konec periody
          - entity: select.test_pms_override
            name: PMS přebití
          - entity: button.test_confirm_pill_taken
            name: Potvrdit prášek
          - entity: date.test_pack_start_date
            name: Datum začátku balení (jen korekce/zpětné zapsání)
          - entity: button.test_test_notification
            name: "Testovací notifikace (obchází čas připomínky)"
          - entity: switch.test_pause_notifications
            name: Pozastavit notifikace
          - entity: time.test_reminder_time
            name: Čas denní připomínky
          - entity: select.test_notification_intensity
            name: Intenzita upozornění

      - type: entities
        title: Diagnostika notifikací
        entities:
          - entity: sensor.test_notification_debug
            name: Poslední výsledek kontroly
            secondary_info: last-changed

      - type: markdown
        title: Detail poslední kontroly
        content: >-
          {% set e = 'sensor.test_notification_debug' %}
          **Kontrola proběhla:** {{ state_attr(e, 'checked_at') or '–' }}

          **Výsledek:** {{ states(e) }}

          **Další kontrola:** {{ state_attr(e, 'next_check_at') or '–' }}
          ({{ state_attr(e, 'next_check_reason') or '–' }})

      - type: entities
        title: Symptomy
        entities:
          - entity: sensor.test_last_symptom
            name: Poslední symptom
            secondary_info: last-changed
          - entity: button.test_log_symptom_cramps
            name: "Zapsat: křeče"
          - entity: button.test_log_symptom_headache
            name: "Zapsat: bolest hlavy"
          - entity: button.test_log_symptom_low_energy
            name: "Zapsat: nízká energie"
          - entity: button.test_log_symptom_mood_change
            name: "Zapsat: změna nálady"

      - type: markdown
        title: Podporovatelé
        content: >-
          {% set s = state_attr('sensor.test_supporters', 'supporters') or [] %}
          {% if s | length == 0 %}
          Zatím žádní podporovatelé - přidej je v Nastavení > Zařízení a služby >
          Perioder > Konfigurovat.
          {% else %}
          {% for supporter in s %}
          - **{{ supporter.device_id }}** ({{ supporter.detail_level }}): {{ supporter.categories }}
          {% endfor %}
          {% endif %}

      - type: custom:perioder-calendar-card
        title: Kalendář cyklu (přehled)
        entities:
          - entity: calendar.test_period_calendar
            color: "#E24B4A"
            icon: mdi:water
          - entity: calendar.test_fertile_calendar
            color: "#378ADD"
            icon: mdi:flower
          - entity: calendar.test_pms_calendar
            color: "#BA7517"
            icon: mdi:weather-cloudy
          - entity: calendar.test_pause_calendar
            color: "#7F77DD"
            icon: mdi:moon-waning-crescent
        pill_entity: calendar.test_pill_calendar

      - type: calendar
        entities:
          - calendar.test_cycle_calendar
        initial_view: dayGridMonth
        title: Kalendář cyklu (detailní, vč. potvrzení prášků)
        card_mod:
          style: |
            ha-card {
              min-height: 500px;
            }

      - type: calendar
        entities:
          - calendar.test_shared_calendar
        initial_view: dayGridMonth
        title: Sdílený kalendář (bez detailu)
        card_mod:
          style: |
            ha-card {
              min-height: 500px;
            }
